<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Find your way</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Sora:wght@400;500;600;700&display=swap">
<style>
:root{color-scheme:light;--marble:#F5F6FA;--card:#fff;--ink:#111827;--sub:#6b7280;--line:#e3e6ee;--red:#9B1B30;--red2:#B8263F;--gold:#C8A24A;--green:#15895a;
  --display:'Fraunces',Georgia,'Times New Roman',serif;--ui:'Sora',-apple-system,system-ui,'Segoe UI',Roboto,sans-serif;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:var(--marble);overflow:hidden;font-family:var(--ui);color:var(--ink);touch-action:none}
#stage{position:absolute;left:50%;top:50%;width:1080px;height:1920px;transform-origin:center center;background:
  radial-gradient(1100px 520px at 50% -120px,rgba(155,27,48,.10),transparent 70%),var(--marble);display:flex;flex-direction:column;padding:36px 0 32px;overflow:hidden}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
.brand{display:flex;justify-content:center;margin-bottom:26px}
.brand img{height:150px;display:block}
.howto{margin:0 24px;background:#fff;border:2px solid var(--line);border-radius:22px;padding:20px 26px;flex:none}
.howto h2{margin:0 0 10px;font-size:22px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--red)}
.howto ol{margin:0;padding-left:28px;font-size:20px;line-height:1.45;color:var(--ink)}
.howto li b{color:var(--red)}
.spacer{flex:1 1 0;min-height:12px}
.maparea{height:800px;display:flex;align-items:center;flex:none}
.mapstart{position:absolute;right:20px;top:20px;z-index:3;font-size:22px;font-weight:600;color:#fff;background:var(--red);border-radius:999px;padding:12px 24px;box-shadow:0 6px 14px rgba(0,0,0,.2)}
.brand .ev{font-size:21px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--red)}
.brand .home{font-size:21px;font-weight:600;color:var(--ink);background:#fff;border:2px solid var(--line);border-radius:999px;padding:11px 20px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:28px}
.tab{position:relative;background:#fff;border:2px solid var(--line);border-radius:18px;padding:17px 8px;font-size:19px;font-weight:600;text-align:center;line-height:1.1}
.tab.on{background:var(--ink);border-color:var(--ink);color:#fff}
.tab .pip{position:absolute;top:8px;right:10px;width:12px;height:12px;border-radius:50%;background:var(--green)}
.tab .pip.b{background:var(--red)}
#mapwrap{position:relative;background:
  radial-gradient(90% 80% at 50% 110%,rgba(155,27,48,.12),transparent 58%),
  linear-gradient(180deg,#e6e1d8 0%,#d2ccc2 100%);
  overflow:hidden;width:100%;flex:none;touch-action:none}
.mapscene{position:absolute;left:2%;right:2%;top:4%;bottom:4%}
.mapinner{position:absolute;left:0;top:0;width:100%;height:100%;transform-origin:0 0;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 8px 24px rgba(17,24,39,.12)}
.mapinner svg{display:block;width:100%;height:100%}
.floorpill{position:absolute;left:20px;top:20px;background:var(--ink);color:#fff;border-radius:999px;padding:12px 24px;font-size:24px;font-weight:600;letter-spacing:.02em;z-index:3}
.heretag{position:absolute;transform:translate(-50%,-135%);background:var(--green);color:#fff;font-size:15px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:6px 12px;border-radius:999px;white-space:nowrap;box-shadow:0 4px 10px rgba(0,0,0,.25);z-index:2}
.dtag{position:absolute;transform:translate(-50%,-135%);background:var(--red);color:#fff;font-size:15px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:6px 12px;border-radius:999px;white-space:nowrap;box-shadow:0 4px 10px rgba(0,0,0,.25);z-index:2}
.pin{fill:rgba(155,27,48,.001);cursor:pointer;touch-action:none;pointer-events:all}
.pin:active{fill:rgba(155,27,48,.16)}
.norouteflag{position:absolute;left:20px;bottom:20px;right:20px;background:rgba(255,255,255,.95);border:2px solid var(--line);border-radius:20px;padding:14px 18px;font-size:22px;color:var(--sub);text-align:center;z-index:3}
.zoomctl{position:absolute;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:4}
.zbtn{width:64px;height:64px;border-radius:18px;background:rgba(17,24,39,.85);color:#fff;font-size:34px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(0,0,0,.25)}
.zbtn.small{font-size:20px;width:64px;height:44px;border-radius:14px}
.destbar{background:#fff;border:2px solid var(--line);border-radius:20px;padding:28px 24px;margin-bottom:24px;flex:none}
.destbar .go{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;font-size:34px;font-weight:700;color:var(--red)}
.destbar .go small{display:block;font-size:19px;font-weight:500;color:var(--sub);margin-top:10px;line-height:1.35}
.destbar.active{border-color:var(--red)}
.destrow{display:flex;align-items:center;gap:16px}
.destrow .badge{flex:none;width:44px;height:44px;border-radius:50%;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:22px}
.destrow .info{flex:1;min-width:0}
.destrow .l{font-size:17px;letter-spacing:.08em;text-transform:uppercase;color:var(--sub);font-weight:600}
.destrow .v{font-size:29px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.destrow .chg{font-size:22px;font-weight:600;color:var(--red);background:#fff7f2;border:2px solid #f0d3d3;border-radius:999px;padding:12px 22px;flex:none}
.opt{display:flex;align-items:center;justify-content:space-between;margin-top:14px;font-size:24px;font-weight:600;color:var(--sub)}
.sw{width:76px;height:44px;border-radius:999px;background:#cfd4e0;position:relative;transition:.2s;flex:none}
.sw::after{content:"";position:absolute;left:4px;top:4px;width:36px;height:36px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.sw.on{background:var(--green)}.sw.on::after{left:36px}
.dirtoggle{display:flex;align-items:center;justify-content:space-between;width:100%;font-size:19px;font-weight:600;color:var(--sub);padding:2px 4px}
.dirpanel{overflow-y:auto;transition:max-height .25s ease;max-height:0}
.dirpanel.open{max-height:260px;margin-top:8px}
.stepline{display:flex;align-items:center;gap:12px;font-size:19px;color:var(--ink);font-weight:600;line-height:1.25}
.stepline b{color:var(--red)}
.stepline .p{font-size:18px;color:var(--sub);font-weight:500;margin-top:2px}
/* picker overlay */
.sheet{position:fixed;inset:0;background:rgba(17,24,39,.5);display:none;z-index:30}
.sheet.show{display:block}
.sheetin{position:absolute;left:50%;top:50%;width:1080px;height:1920px;transform-origin:center center;background:var(--marble);display:flex;flex-direction:column;padding:46px 46px 34px;}
.pk-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.pk-close{font-size:26px;font-weight:600;background:#fff;border:2px solid var(--line);border-radius:999px;padding:14px 26px}
h1{font-family:var(--display);font-weight:600;font-size:58px;line-height:1.05;margin:4px 0 20px;letter-spacing:-.02em}
.search{color:var(--ink);-webkit-text-fill-color:var(--ink);caret-color:var(--red);font-family:var(--ui);width:100%;font-size:28px;padding:20px 24px;border:2px solid var(--line);border-radius:20px;background:#fff;margin-bottom:18px;outline:none}
.search:focus{border-color:var(--red)}
.pk-tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.pk-tab{background:#fff;border:2px solid var(--line);border-radius:22px;padding:18px 6px;font-size:24px;font-weight:600;text-align:center}
.pk-tab.on{background:var(--ink);border-color:var(--ink);color:#fff}
.pk-grid{flex:1;min-height:0;overflow-y:auto;display:grid;grid-template-columns:1fr 1fr;gap:16px;align-content:start;padding:4px 4px 20px}
.tile{display:flex;flex-direction:column;justify-content:center;background:#fff;border:2px solid var(--line);border-radius:24px;padding:0 26px;min-height:110px;text-align:left;font-size:29px;font-weight:600;line-height:1.15}
.pk-mode{display:grid;grid-template-columns:1fr 1fr;gap:0;background:#fff;border:2px solid var(--line);border-radius:999px;padding:6px;margin-bottom:18px}
.pk-mode button{font-size:24px;font-weight:700;padding:16px;border-radius:999px;color:var(--sub)}
.pk-mode button.on{background:var(--red);color:#fff}
.pk-chips{display:flex;gap:10px;margin:-4px 0 16px;flex-wrap:wrap}
.pk-chip{font-size:20px;font-weight:600;padding:10px 20px;border-radius:999px;background:#fff;border:2px solid var(--line)}
.pk-chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.sess{display:grid;grid-template-columns:190px 1fr;gap:18px;align-items:center;background:#fff;border:2px solid var(--line);border-radius:22px;padding:18px 22px;text-align:left}
.sess .st{font-size:20px;font-weight:700;color:var(--red);line-height:1.25}
.sess .sb b{display:block;font-size:30px;font-weight:700;line-height:1.1}
.sess .sb span{display:block;font-size:21px;font-weight:600;margin-top:4px}
.sess .sb small{display:block;font-size:18px;color:var(--sub);margin-top:3px}
.sess.nomap{opacity:.55}
.sesstag{font-size:17px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--red);margin-bottom:2px}
.clock{position:absolute;top:26px;right:28px;z-index:5;font-size:21px;font-weight:700;color:#fff;background:var(--ink);border-radius:999px;padding:10px 20px;box-shadow:0 4px 12px rgba(0,0,0,.18)}
.sesshead{font-size:19px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--sub);margin:10px 4px 0}
.sess.live{border-color:var(--red);box-shadow:0 0 0 3px rgba(155,27,48,.15)}
.sess.prog{background:#fbf5f0}
.kb{flex:none;margin-top:14px;background:#d9dce4;border-radius:26px;padding:14px;display:flex;flex-direction:column;gap:10px}
.kb-row{display:flex;gap:10px;justify-content:center}
.kb button{flex:1 1 0;max-width:92px;height:84px;border-radius:14px;background:#fff;font-size:32px;font-weight:600;color:var(--ink);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.kb button.w{max-width:none;flex:2 1 0;font-size:24px}
.kb button.sp{max-width:none;flex:5 1 0;font-size:24px}
.kb button.done{max-width:none;flex:2 1 0;background:var(--red);color:#fff;font-size:26px}
.kb button:active{background:#e8ebf2}
.pkbody{display:flex;flex-direction:column;flex:1;min-height:0}
.tile small{font-size:19px;font-weight:500;color:var(--sub);margin-top:4px}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(21,137,90,.5)}100%{box-shadow:0 0 0 22px rgba(21,137,90,0)}}
</style></head>

    <div class="destrow"><span class="info"><div class="l" style="font-size:16px;font-weight:700;color:#15895a;letter-spacing:.04em">FROM · ${esc(fromName)}</div>${S.sess!=null?`<div class="l" style="font-size:18px;font-weight:700;color:var(--red);letter-spacing:.04em">${SESS[S.sess].bn?'Breakout '+SESS[S.sess].bn+' · ':''}${esc(SESS[S.sess].g)} · ${esc(SESS[S.sess].t)}</div>`:''}<div class="v">${esc(T.name)}</div></span>
    <button class="chg" data-a="opendest">Change</button></div>
    ${err?`<div style="margin-top:12px;font-size:22px;color:var(--red)">${esc(S.route.error)}</div>`:''}
    <div class="opt" data-a="openfrom"><span>Change starting room</span><span class="chg" style="padding:8px 14px">Here</span></div>
    <div class="opt" data-a="avoid"><span>No stairs (elevator only)</span><span class="sw ${S.avoid?'on':''}"></span></div>
  </div>`;
}
function stepsHtml(){
  if(!S.route||S.route.error) return '';
  const T=placesById[S.to], last=S.route.legs.length-1, home=placesById[S.from||CONFIG.homePlace].name;

  S.route.legs.forEach((leg,i)=>{
    const on = S.tab===leg.floor;
    const from=i===0?home:PN[Object.keys(D.portals[leg.floor]).find(g=>D.portals[leg.floor][g].x===leg.path[0][0]&&D.portals[leg.floor][g].y===leg.path[0][1])]||leg.from;
    const to=i===last?T.name:leg.to;

    if(i<last){ const v=S.route.verts[i];
      lines.push(`<div class="stepline" style="padding:4px 14px 10px;color:var(--sub);font-weight:500"><span style="width:24px"></span><span>then take the ${v.type==='elevator'?'elevator':'stairs'} ${v.dir} to ${floorsById[S.route.legs[i+1].floor].name}</span></div>`); }

let svgEl=null,dotEl=null,animTok=0,seqTok=0;
function mapSvg(floorId){
  const fl=floorsById[floorId];
  const li = legOnFloor(floorId);
  const showHome = S.from && placesById[S.from].floor===floorId;
  const showDest = S.to && placesById[S.to].floor===floorId && !(S.route&&S.route.error);
  let inner='';
  if(li!==null && S.route && !S.route.error){
    const leg=S.route.legs[li];
    const d='M'+leg.path.map(p=>p.join(' ')).join(' L');
    const st=leg.path[0], en=leg.path[leg.path.length-1];
    const w = 1850, sw=w/210, rd=w/70;
    const line=`fill="none" stroke-linejoin="miter" stroke-miterlimit="3" stroke-linecap="butt"`;
    inner += `<path d="${d}" ${line} stroke="#fff" stroke-width="${sw*1.9}"/>
      <path d="${d}" ${line} stroke="#9B1B30" stroke-opacity=".22" stroke-width="${sw*1.35}"/>
      <g id="rg"><path id="rl" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100" d="${d}" ${line} stroke="#9B1B30" stroke-width="${sw*1.05}"/>

  }
  if(showHome){ const p=placesById[S.from]; inner+=pin([p.x,p.y],'#15895a'); }
  if(showDest){ const p=placesById[S.to]; inner+=pin([p.x,p.y],'#9B1B30'); }
  const pins = ALLOWED_PLACES.filter(p=>p.floor===floorId&&p.poly).map(p=>
    `<polygon class="pin" data-a="destpick" data-v="${p.id}" points="${p.poly.map(pt=>pt.join(',')).join(' ')}" aria-label="${esc(p.name)}"></polygon>`).join('');
  const tag=(x,y,t,col)=>{const fs=24,w=t.length*fs*0.62+30,h=fs+16,ty=y-PIN_H-h-6;
    return `<g pointer-events="none"><rect x="${x-w/2}" y="${ty}" width="${w}" height="${h}" rx="${h/2}" fill="${col}"/><text x="${x}" y="${ty+h/2+fs*0.36}" text-anchor="middle" font-family="Sora,system-ui,sans-serif" font-weight="700" font-size="${fs}" fill="#fff" letter-spacing="1">${esc(t)}</text></g>`;};
  if(showHome){ const p=placesById[S.from]; inner+=tag(p.x,p.y,'YOU ARE HERE','#15895a'); }
  const tags='';
  return {svg:`<svg id="svg" viewBox="${floorsById[floorId].vb.join(' ')}" preserveAspectRatio="xMidYMid meet"><image href="${fl.img}" x="0" y="0" width="1850" height="1100"/><g id="pinlayer">${pins}</g>${inner}</svg>`, hasLeg: li!==null, tags};
}
const PIN_R=34, PIN_H=PIN_R*2.7;
function pin(p,col){
  const [x,y]=p, R=PIN_R, cy=y-R*1.65;
  const d=`M ${x} ${y} C ${x-R*0.35} ${y-R*0.55} ${x-R} ${cy+R*0.55} ${x-R} ${cy} A ${R} ${R} 0 1 1 ${x+R} ${cy} C ${x+R} ${cy+R*0.55} ${x+R*0.35} ${y-R*0.55} ${x} ${y} Z`;
  return `<g pointer-events="none"><ellipse cx="${x}" cy="${y}" rx="${R*0.45}" ry="${R*0.16}" fill="rgba(0,0,0,.25)"/><path d="${d}" fill="${col}" stroke="#fff" stroke-width="7"/><circle cx="${x}" cy="${cy}" r="${R*0.42}" fill="#fff"/></g>`;
}
function mk(p,txt,col,rd,sw){
  return `<circle cx="${p[0]}" cy="${p[1]}" r="${rd}" fill="${col}" stroke="#fff" stroke-width="${sw*3}"/><text x="${p[0]}" y="${p[1]+rd*0.36}" text-anchor="middle" font-family="Sora,system-ui,sans-serif" font-weight="700" font-size="${rd*1.05}" fill="#fff">${txt}</text>`;
}
function pickScreen(bodyOnly){
  const q=S.pQ.trim().toLowerCase();
  const head=`<div class="pk-top"><img src="${LOGO}" style="height:70px" alt=""><button class="pk-close" data-a="closedest">Close ✕</button></div>
  <h1>${S.pickFor==='from'?'Where are you<br>right now?':'Where do you<br>want to go?'}</h1>
  ${S.pickFor==='from'?'':`<div class="pk-mode"><button class="${S.pMode==='sess'?'on':''}" data-a="pmode" data-v="sess">My Seva</button><button class="${S.pMode==='rooms'?'on':''}" data-a="pmode" data-v="rooms">All rooms</button></div>`}`;
  if(S.pickFor!=='from' && S.pMode==='sess'){
    const n=etNow();
    let all=SESS.map((x,i)=>Object.assign({i},x)).filter(x=>!sessEnded(x,n));
    window.__sessSig=all.length;
    const days=Object.keys(DAY_NAMES).filter(d=>all.some(x=>x.dy===d));
    if(!days.includes(S.pDay)) S.pDay=days[0]||null;
    let list=all;
    if(q) list=list.filter(x=>(x.g+' '+x.r).toLowerCase().includes(q));
    else list=list.filter(x=>x.dy===S.pDay);
    let last='', rows='';
    for(const x of list){
      const hd=q?'':(x.kind==='bk'?x.blk:'');
      if(hd&&hd!==last){rows+=`<div class="sesshead">${esc(hd)}</div>`;} last=hd||last;
      if(!hd&&x.kind==='prog') last='';
      const live=sessLive(x,n);
      const bl=x.kind==='bk'?'Breakout '+x.bn:'Program';
      const tag=[q?DAY_NAMES[x.dy]:'',bl,live?'Now':''].filter(Boolean).join(' · ');
      rows+=`<button class="sess ${x.p?'':'nomap'} ${live?'live':''} ${x.kind==='prog'?'prog':''}" ${x.p?`data-a="sesspick" data-v="${x.i}"`:''}><div class="st">${tag?`<div class="sesstag">${esc(tag)}</div>`:''}${esc(x.t)}</div><div class="sb"><b>${esc(x.g)}</b><span>${esc(x.r)} · ${esc(floorsById[x.f].name)}</span>${x.d?`<small>${esc(x.d)}</small>`:''}${x.p?'':'<small>Room not on the map yet</small>'}</div></button>`;
    }
    const empty = all.length ? '<div style="font-size:26px;color:var(--sub)">No sevas match that.</div>'
      : '<div style="font-size:26px;color:var(--sub);line-height:1.4">All scheduled NAAM sessions have finished. Tap <b>All rooms</b> to find any room.</div>';
    const inp=`<input class="search" id="q" type="search" placeholder="Type your Seva, e.g. KM RA" value="${esc(S.pQ)}" autocomplete="off" inputmode="none" data-a="kbopen">`;
    const body=`
  ${q||!days.length?'':`<div class="pk-tabs" style="grid-template-columns:repeat(${days.length},1fr)">${days.map(d=>`<button class="pk-tab ${S.pDay===d?'on':''}" data-a="pday" data-v="${d}">${esc(DAY_NAMES[d])}</button>`).join('')}</div>`}
  <div class="pk-grid" id="grid" style="grid-template-columns:1fr">${rows||empty}</div>`;
    return bodyOnly?body:head+inp+`<div id="pkbody" class="pkbody">${body}</div><div id="kbwrap">${S.kb?kbHtml():''}</div>`;
  }
  let list = q ? ALLOWED_PLACES.filter(p=>p.name.toLowerCase().includes(q)) : ALLOWED_PLACES.filter(p=>p.floor===S.pTab);
  list = list.slice().sort((a,b)=>(q?TAB_ORDER.indexOf(a.floor)-TAB_ORDER.indexOf(b.floor):0)||a.name.localeCompare(b.name));
  const inp=`<input class="search" id="q" type="search" placeholder="Search for a room" value="${esc(S.pQ)}" autocomplete="off" inputmode="none" data-a="kbopen">`;
  const body=`
  ${q?'':`<div class="pk-tabs">${TAB_ORDER.map(id=>`<button class="pk-tab ${S.pTab===id?'on':''}" data-a="ptab" data-v="${id}">${esc(floorsById[id].name)}</button>`).join('')}</div>`}
  <div class="pk-grid" id="grid">${list.map(p=>`<button class="tile" data-a="destpick" data-v="${p.id}">${esc(p.name)}${q?`<small>${esc(floorsById[p.floor].name)}</small>`:''}</button>`).join('')||'<div style="font-size:26px;color:var(--sub)">No rooms match that.</div>'}</div>`;
  return bodyOnly?body:head+inp+`<div id="pkbody" class="pkbody">${body}</div><div id="kbwrap">${S.kb?kbHtml():''}</div>`;
}
let ptrs=new Map(), dragMoved=false, pinchStart=null;
function zoomOf(tab){ return (S.zoom[tab]&&S.zoom[tab].s) || 1; }
function setZoom(tab,s,cx,cy){
  s=Math.max(1,Math.min(4,s));
  const el=document.getElementById('mapwrap'); if(!el) return;
  const r={w:el.clientWidth,h:el.clientHeight};
  cx=cx==null?r.w/2:cx; cy=cy==null?r.h/2:cy;
  const z=S.zoom[tab]||{s:1,x:0,y:0};
  const wx=(cx-z.x)/z.s, wy=(cy-z.y)/z.s;
  const nx=cx-wx*s, ny=cy-wy*s;
  S.zoom[tab]=clampZoom(tab,{s,x:nx,y:ny});
  applyTransform();
}
function clampZoom(tab,z){
  const el=document.getElementById('mapwrap'); if(!el) return z;
  const w=el.clientWidth,h=el.clientHeight;
  const minX=Math.min(0,w-w*z.s), minY=Math.min(0,h-h*z.s);
  return {s:z.s, x:Math.max(minX,Math.min(0,z.x)), y:Math.max(minY,Math.min(0,z.y))};
}
function applyTransform(){
  const inner=document.getElementById('mapinner'); if(!inner) return;
  const z=S.zoom[S.tab]||{s:1,x:0,y:0};
  inner.style.transform=`translate(${z.x}px,${z.y}px) scale(${z.s})`;
}
function mapPointerDown(e){
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY}); dragMoved=false;
  if(ptrs.size===2){ const [a,b]=[...ptrs.values()]; pinchStart={d:Math.hypot(a.x-b.x,a.y-b.y), s:zoomOf(S.tab)}; }
}
function mapPointerMove(e){
  if(!ptrs.has(e.pointerId)) return;
  const prev=ptrs.get(e.pointerId), cur={x:e.clientX,y:e.clientY}; ptrs.set(e.pointerId,cur);
  if(ptrs.size===2&&pinchStart){
    const [a,b]=[...ptrs.values()]; const d=Math.hypot(a.x-b.x,a.y-b.y);
    const el=document.getElementById('mapwrap').getBoundingClientRect();
    setZoom(S.tab, pinchStart.s*(d/pinchStart.d), (a.x+b.x)/2-el.left, (a.y+b.y)/2-el.top);
    dragMoved=true; return;
  }
  if(ptrs.size===1){
    const dx=cur.x-prev.x, dy=cur.y-prev.y;
    if(Math.hypot(dx,dy)>3) dragMoved=true;
    const z=S.zoom[S.tab]||{s:1,x:0,y:0};
    if(z.s>1){ S.zoom[S.tab]=clampZoom(S.tab,{s:z.s,x:z.x+dx,y:z.y+dy}); applyTransform(); }
  }
}
function mapPointerUp(e){ ptrs.delete(e.pointerId); if(ptrs.size<2) pinchStart=null; }
function mapWheel(e){ e.preventDefault(); const el=document.getElementById('mapwrap').getBoundingClientRect();
  setZoom(S.tab, zoomOf(S.tab)*(e.deltaY<0?1.15:1/1.15), e.clientX-el.left, e.clientY-el.top); }
function render(){
  const {svg,hasLeg,tags} = mapSvg(S.tab);
  const noRoute = S.to && S.route && !S.route.error && legOnFloor(S.tab)===null && S.tab!==homeFloor && !(placesById[S.to].floor===S.tab);
  stage.innerHTML = `<div class="clock" id="clock">${esc(clockText())}</div>${brand()}<div class="spacer" style="flex-grow:.45"></div>
    <div style="padding:0 24px;flex:none">${destBar()}
    ${S.route&&!S.route.error?`<button class="dirtoggle" data-a="toggledir"><span>Directions (${S.route.legs.length} ${S.route.legs.length>1?'floors':'floor'})</span><span>${S.dirOpen?'Hide ▲':'Show ▼'}</span></button>
    <div class="dirpanel ${S.dirOpen?'open':''}">${stepsHtml()}</div>`:''}</div>
    <div style="height:20px;flex:none"></div>${howto()}<div class="spacer" style="flex-grow:.55"></div>${tabsHtml()}
    <div class="maparea"><div id="mapwrap" style="aspect-ratio:${floorsById[S.tab].vb[2]}/${floorsById[S.tab].vb[3]}"><div class="mapscene" id="mapscene"><div class="mapinner" id="mapinner">${svg}${tags}</div></div><div class="floorpill">${esc(floorsById[S.tab].name)}</div><button class="mapstart" data-a="reset">Start over</button>${noRoute?`<div class="norouteflag">Your route does not pass through this floor.</div>`:''}</div></div><div class="spacer" style="flex-grow:1.3"></div>`;
  if(S.picker){ sheetIn.innerHTML = pickScreen(); sheet.classList.add('show'); }
  else sheet.classList.remove('show');
  const mw=document.getElementById('mapwrap');
  if(mw){ mw.onpointerdown=mapPointerDown; mw.onpointermove=mapPointerMove; mw.onpointerup=mapPointerUp; mw.onpointercancel=mapPointerUp; mw.onwheel=mapWheel; }
  applyTransform();
  startAnim();
}
function startAnim(){
  cancelAnimationFrame(window.__anim); const myTok=++animTok, mySeq=seqTok;
  const rl=document.getElementById('rl'), dot=document.getElementById('dot'), rg=document.getElementById('rg');
  if(!rl||!dot){ scheduleAdvance(mySeq,900); return; }
  const P=JSON.parse(dot.dataset.p),cum=[0];
  for(let i=1;i<P.length;i++)cum.push(cum[i-1]+Math.hypot(P[i][0]-P[i-1][0],P[i][1]-P[i-1][1]));
  const total=cum[cum.length-1]||1,TRAVEL=Math.max(1400,Math.min(4000,total/0.65)),HOLD=1200,t0=performance.now();
  const ease=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;
  function frame(t){
    if(myTok!==animTok) return;
    const e=t-t0; const p=Math.min(1,ease(Math.min(1,e/TRAVEL)));
    rl.style.strokeDashoffset=100*(1-p);
    const s=p*total;let i=1;while(i<cum.length-1&&cum[i]<s)i++;
    const k=(s-cum[i-1])/((cum[i]-cum[i-1])||1);
    dot.setAttribute('cx',P[i-1][0]+(P[i][0]-P[i-1][0])*k);dot.setAttribute('cy',P[i-1][1]+(P[i][1]-P[i-1][1])*k);
    if(e<TRAVEL+HOLD){ window.__anim=requestAnimationFrame(frame); }
    else { scheduleAdvance(mySeq,0); }
  }
  window.__anim=requestAnimationFrame(frame);
}
/* Walks the route one floor at a time with no clicking: when this leg finishes, switch to the next
   floor's map and keep going; after the last leg, pause, then start the whole trip over. */
function scheduleAdvance(mySeq,delay){
  if(!S.route||S.route.error) return;
  clearTimeout(window.__seqTimer);
  window.__seqTimer=setTimeout(()=>{
    if(mySeq!==seqTok) return;
    const legs=S.route.legs, cur=legs.findIndex(l=>l.floor===S.tab);
    const next=(cur<0?0:cur+1)%legs.length;
    S.tab=legs[next].floor; render();
  },delay);
}
function playFrom(idx){
  if(!S.route||S.route.error||!S.route.legs[idx]) return;
  seqTok++; S.tab=S.route.legs[idx].floor; render();
}

function act(a,v){
  if(a==='kbopen'){ if(!S.kb){S.kb=true; const w=document.getElementById('kbwrap'); if(w) w.innerHTML=kbHtml();} poke(); return; }
  if(a==='kbkey'){
    if(v==='DONE'){S.kb=false; const w=document.getElementById('kbwrap'); if(w) w.innerHTML=''; poke(); return;}
    if(v==='CLEAR') S.pQ=''; else if(v==='BACK') S.pQ=S.pQ.slice(0,-1); else S.pQ=(S.pQ+v).replace(/^ +/,'');
    const q=document.getElementById('q'); if(q) q.value=S.pQ;
    const pb=document.getElementById('pkbody'); if(pb){ pb.innerHTML=pickScreen(true); pb.scrollTop=0; }
    poke(); return;
  }
  if(a==='reset'){S.sess=null;S.kb=false;seqTok++;clearTimeout(window.__seqTimer);reset();return;}
  if(a==='tab'){ const li=legOnFloor(v); if(li!==null){ playFrom(li); return; } S.tab=v; seqTok++; }
  else if(a==='openfrom'){S.picker=true;S.pickFor='from';S.pMode='rooms';S.pTab=S.tab;S.pQ='';S.kb=false;}
  else if(a==='opendest'){ if(!S.from){S.picker=true;S.pickFor='from';S.pMode='rooms';S.pTab=S.tab;S.pQ='';S.kb=false;} else {S.picker=true;S.pickFor='to';S.pTab=S.tab;S.pQ='';S.kb=false;} }
  else if(a==='closedest'){S.picker=false;S.kb=false;}
  else if(a==='ptab'){S.pTab=v;}
  else if(a==='destpick'){
    if(!S.from||S.pickFor==='from'){ S.from=v; S.tab=placesById[v].floor; S.to=null; S.sess=null; S.route=null; S.picker=false; S.pickFor='to'; S.pMode='sess'; }
    else { S.sess=null;S.to=v;S.picker=false;seqTok++;compute();if(S.route&&!S.route.error)seqTok++; }
  }
  else if(a==='sesspick'){ if(!S.from) return; const x=SESS[+v]; if(!x||!x.p) return; S.sess=+v;S.to=x.p;S.picker=false;seqTok++;compute();if(S.route&&!S.route.error)seqTok++;}
  else if(a==='pmode'){S.pMode=v;S.pQ='';}
  else if(a==='pday'){S.pDay=v;}
  else if(a==='paud'){S.pAud=v;}
  else if(a==='avoid'){S.avoid=!S.avoid;seqTok++;compute();}
  else if(a==='toggledir'){S.dirOpen=!S.dirOpen;}
  else if(a==='zoom'){ setZoom(S.tab, zoomOf(S.tab)*(v==='1'?1.4:1/1.4)); return; }
  else if(a==='zoomreset'){ S.zoom[S.tab]=null; applyTransform(); return; }
  render(); poke();
}
document.addEventListener('click',e=>{ if(dragMoved&&e.target.classList&&e.target.classList.contains('pin')){dragMoved=false;return;} const b=e.target.closest('[data-a]');if(b)act(b.dataset.a,b.dataset.v);});
document.addEventListener('input',e=>{ if(e.target.id==='q'){ S.pQ=e.target.value; const pb=document.getElementById('pkbody'); if(pb){ pb.innerHTML=pickScreen(true); pb.scrollTop=0; } } });
setInterval(()=>{
  const c=document.getElementById('clock'); if(c) c.textContent=clockText();
  if(S.picker&&S.pMode==='sess'){
    const n=etNow(), cnt=SESS.filter(x=>!sessEnded(x,n)).length;
    if(cnt!==window.__sessSig){ const pb=document.getElementById('pkbody'); if(pb) pb.innerHTML=pickScreen(true); }
  }
},1000);
let idle;function poke(){clearTimeout(idle);idle=setTimeout(reset,CONFIG.idleSeconds*1000);try{parent.postMessage({type:'nam-map-poke'},'*');}catch(e){}}
['pointerdown','touchstart'].forEach(ev=>addEventListener(ev,poke,{passive:true}));

(function(){
  if(!new URLSearchParams(location.search).has('embed')) return;
  const b=document.createElement('button');
  b.type='button';
  b.textContent='\u2190 Info';
  b.setAttribute('aria-label','Back to info');
  Object.assign(b.style,{
    position:'fixed',left:'28px',top:'26px',zIndex:'50',
    fontFamily:'Sora,system-ui,sans-serif',fontSize:'18px',fontWeight:'700',
    letterSpacing:'.08em',textTransform:'uppercase',
    color:'#fff',background:'#111827',border:'0',borderRadius:'999px',
    padding:'12px 22px',cursor:'pointer',boxShadow:'0 4px 12px rgba(0,0,0,.18)'
  });
  b.addEventListener('click',function(){ try{ parent.postMessage({type:'nam-map-back'},'*'); }catch(e){} });
  document.body.appendChild(b);
})();
render();poke();
window.WF={S,act,placesById,D,render,findRoute,CONFIG,compute};
